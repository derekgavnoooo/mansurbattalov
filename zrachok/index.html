<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зрачок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* вертикальный кадр 9:16: бесконечный наезд в зрачок; 5 тонов засохшей крови, дизер 4×4 */
:root{
  --void:#040202; --scab:#260406; --meat:#600c0e; --raw:#a83a30; --bone:#e6d8c0;
  --mono:"Courier New",Courier,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--bone);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#gate{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;border:0;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--void);color:var(--bone);font:13px/1.6 var(--mono);text-align:center;cursor:pointer}
#gate[hidden]{display:none}
#gate:focus-visible{outline:1px dashed var(--raw);outline-offset:-12px}
#gate .t{font-size:clamp(20px,6vw,34px);letter-spacing:.4em;color:var(--raw);text-transform:uppercase}
#gate .w{max-width:36ch;opacity:.55}
</style>
</head>
<body>
<canvas id="c" aria-label="Бесконечный наезд в зрачок глаза"></canvas>
<button id="gate" type="button">
  <span class="t">не&nbsp;моргай</span>
  <span id="gl">[ смотреть ]</span>
  <span class="w">Резкие вспышки, мерцание и громкий звук.</span>
</button>
<script>
(()=>{
const W=360,H=640,DUR=43,FPS=12,K=16,S0=13,TAU=Math.PI*2;
const PAL=[[4,2,2],[38,4,6],[96,12,14],[168,58,48],[230,216,192]];
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;
  h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vn(x,y)*.5+vn(x*2.03+5.2,y*2.03+1.3)*.25+vn(x*4.01+9.1,y*4.01+3.7)*.125}
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

/* глубина погружения: 1 единица = один зрачок */
const DK=[[0,0],[4,0],[11,1],[18,2],[24.5,3],[30,4],[34,5],[38.3,5.12]];
function depth(t){
  for(let i=0;i<DK.length-1;i++){const [a,da]=DK[i],[b,db]=DK[i+1];
    if(t<b){let p=(t-a)/(b-a);if(i===1)p=p*p;return da+(db-da)*p}}
  return DK[DK.length-1][1];
}
const tension=t=>sm(4,34,t);
/* сердце: фаза заранее, чтобы картинка и звук били вместе */
const PH=new Float32Array(DUR*100+2);
for(let i=1;i<PH.length;i++){const t=i/100;PH[i]=PH[i-1]+(t<38.8?(50+100*tension(t))/60/100:0)}
function hbAt(t){const p=PH[Math.min(PH.length-1,Math.round(t*100))]%1;
  return t>=38.8?0:Math.exp(-p*14)+.6*(p>.17?Math.exp(-(p-.17)*14):0)}
const BLINKS=[[1,13],[3,27]];
function centerOpen(n,t){
  let o=n===0?Math.min(1,sm(.5,3,t)*(t<3?1+Math.sin(t*29)*.12:1)):1;
  for(const [bn,bt] of BLINKS)if(bn===n&&t>=bt&&t<bt+.3)o*=Math.abs((t-bt)/.3*2-1);
  if(n===5)o*=1-sm(38.3,38.8,t);
  return o;
}
const stare=t=>(t>=19.5&&t<22)||t>=35;

function miniEye(v,dx,dy,r,open,lx,ly,seed){
  const ax=Math.abs(dx);if(ax>=r*1.35)return v;
  const half=ax<r?.55*r*open*Math.pow(1-(dx/r)**2,.8):0,ay=Math.abs(dy);
  if(ay<half){
    const ix=dx/r-lx,iy=dy/r-ly,ir=Math.hypot(ix,iy);let e;
    if(ir<.2)e=0;else if(ir<.45)e=ir>.41?.06:.22+.3*vn(Math.atan2(iy,ix)*5+seed,ir*12);
    else e=.94-Math.max(0,ax/r-.65)*1.1;
    e-=Math.max(0,1-(half-ay)/(half*.4+.01))*(dy<0?.45:.2);
    if((ix+.14)**2+(iy+.14)**2<.008)e=1;
    return e;
  }
  const ring=Math.hypot(dx/r,dy/r*1.8);
  if(ring<1.35){const k=1-ring/1.35,wr=Math.sin(dy/r*20+dx/r*3+seed)*.5+.5;v=v*(1-k*.55)+k*.36*wr;
    if(ax<r&&ay-half<.07*r)v-=.5}
  return v;
}

function layer(n,x,y,t,hb,lvl,hh){
  /* плоть */
  const s=.2,sd=n*17.3,b=1-hb*.03;x*=b;y*=b;
  const wx=fbm(x*s+sd+t*.05,y*s)*3,wy=fbm(x*s+11.3,y*s+sd-t*.04)*3;
  const f=fbm(x*s*1.3+wx,y*s*1.3+wy+sd),nn=fbm(x*.4+wy*.6+sd,y*.4-wx*.6);
  const vein=Math.max(0,1-Math.abs(nn-.5)*(n===3?13:24));
  let v=f*1.25-.22-vein*(n===3?.6:.45)+hb*.1;
  if(n>=4)v*=.72;
  /* мелкие глаза вокруг */
  const dens=[0,.55,.35,.95,.6,.75][Math.min(n,5)];
  if(dens>0){const C=4.2,ci=Math.floor(x/C),cj=Math.floor(y/C),h1=hash(ci+n*999,cj);
    if(h1<dens){const ex=(ci+.25+.5*hash(ci,cj+7))*C,ey=(cj+.25+.5*hash(ci+3,cj))*C,r=.8+1.1*hash(ci+5,cj+5);
      if((ex/9)**2+(ey/7)**2>1.15){
        let o=1;if(hash(Math.floor(t*1.3+h1*9),ci*7+cj)<.1)o=.08;
        if(n===5&&t>=38.3)o*=1-sm(38.3,38.6,t);
        let lx=0,ly=0;
        if(!stare(t)){const l=Math.hypot(ex,ey)||1;lx=-ex/l*.32+Math.sin(t*.8+h1*20)*.05;ly=-ey/l*.25}
        v=miniEye(v,x-ex,y-ey,r,o,lx,ly,h1*50)}}}
  /* рот из зубов вокруг главного глаза */
  if(n===2){const e=Math.hypot(x/7.1,y/5.4);
    if(e>.6&&e<1.08){const th=Math.atan2(y,x),q=(th+Math.PI)/TAU*30,k=Math.floor(q),u=q-k;
      const tp=Math.sqrt(Math.max(0,1-Math.abs(u-.5)*2.3)),len=(.12+.2*hash(k,7))*tp;
      if(e>=.97)v=.06;else if(e>=.93)v=.45;
      else if(e>.93-len)v=.9-(.93-e)/Math.max(.01,len)*.32-(hash(k,3)>.8?.25:0);
      else v=.03+.04*hash(Math.floor(x*9),Math.floor(y*9))}}
  /* главный глаз, зрачок всегда в центре */
  const op=centerOpen(n,t),A=6,ax=Math.abs(x),ay=Math.abs(y);
  const half=ax<A?3.2*op*Math.pow(1-(x/A)**2,.8):0;
  if(ay<half){
    const r=Math.hypot(x,y);
    if(r<1){
      let pv=0;
      if(lvl<1){const rev=sm(30,200,320/hh);if(rev>0)pv=rev*layer(n+1,x*K,y*K,t,hb,lvl+1,hh*K)}
      pv*=1-sm(.84,1,r);
      if(n===5&&lvl===0&&Math.abs(x+.05)<.26&&Math.abs(y+.08)<.44)pv=Math.max(pv,.62+.1*Math.sin(y*40));
      v=pv;
    }else if(r<2.6){
      const ang=Math.atan2(y,x);
      if(n===4){const rr=r-1,k=Math.min(1,Math.floor(rr/.8)),cnt=10+6*k,q=(ang+Math.PI)/TAU*cnt,qi=Math.floor(q);
        const rad=1+k*.8+.4,la=(q-qi-.5)*TAU*rad/cnt,lr=rr-k*.8-.4;
        v=.18;v=miniEye(v,la,lr,.33,hash(Math.floor(t*1.5),qi+k*40)<.12?.1:1,0,0,qi);}
      else v=r>2.38?.06:r<1.14?.1:.2+.3*vn(ang*7+n*3,r*3.5);
      if((x+1.7)**2+(y+1.1)**2<.06)v=.97;
    }else{
      const nv=fbm(x*1.6+n,y*1.6);
      v=.93-Math.max(0,1-Math.abs(nv-.5)*12)*.7-Math.max(0,ax-4)*.15;
    }
    if(r>=1)v-=Math.max(0,1-(half-ay)/(half*.4+.01))*(y<0?.45:.2);
  }else if(n!==2||Math.hypot(x/7.1,y/5.4)>1.08){
    const ring=Math.hypot(x/A,y/4);
    if(ring<1.35){const k=1-ring/1.35,wr=Math.sin(y*5+x*.6+n)*.5+.5;v=v*(1-k*.5)+k*.35*wr}
    if(ax<A&&ay-half<.25)v-=.5;
  }else if(ax<A&&ay-half<.25)v-=.5;
  return v;
}

/* вывод */
const out=document.getElementById('c');out.width=W;out.height=H;
const oc=out.getContext('2d',{alpha:false}),img=oc.createImageData(W,H),px=img.data;
const mask=document.createElement('canvas');mask.width=W;mask.height=H;const mc=mask.getContext('2d',{willReadFrequently:true});
const MSG=[[5,7.5,'не моргай'],[12,14.5,'глубже'],[19.5,22,'оно видит тебя изнутри'],[26.5,28.5,'ты уже внутри'],
  [31,33,'ещё глубже'],[35.5,38.3,'ОНО ТОЖЕ|СМОТРИТ В ЭКРАН'],[40.2,43.5,'теперь моргни']];
const CROSS=[11,18,24.5,30,34];
const tear=(fr)=>hash(fr,31)<.02+.12*tension(fr/FPS)||CROSS.some(c=>Math.abs(fr/FPS-c)<.13);
function text(t,fr){
  mc.clearRect(0,0,W,H);mc.textAlign='center';mc.textBaseline='middle';
  for(const [a,z,s] of MSG)if(t>=a&&t<z&&(hash(fr,5)>.18||a>40)){
    const big=s===s.toUpperCase(),lines=s.split('|');
    mc.font=`bold ${big?26:18}px "Courier New",monospace`;
    const y0=big?H*.5-18:a>40?H*.5:H*(.16+.1*hash(a|0,1)),j=big?3:1.5;
    lines.forEach((l,k)=>{const ox=(hash(fr,k+9)-.5)*j*2,oy=(hash(fr,k+19)-.5)*j*2,y=y0+k*34;
      mc.fillStyle='rgb(255,0,0)';mc.fillText(l,W/2+2+ox,y+2+oy);mc.fillStyle='rgb(0,255,0)';mc.fillText(l,W/2+ox,y+oy)});
  }
  return mc.getImageData(0,0,W,H).data;
}
function renderFrame(t){
  const fr=Math.round(t*FPS),md=text(t,fr),hb=hbAt(t),te=tension(t);
  const sub=t>=39.6&&t<39.76,black=t>=38.8&&!sub;
  let d=depth(t);if(sub)d=3.35;
  const n=Math.floor(d),hh=S0*Math.pow(K,-(d-n));
  const shx=(hash(fr,41)-.5)*te*3,shy=(hash(fr,42)-.5)*te*3;
  const tr=tear(fr),inv=!black&&hash(fr,43)<.004+te*.015;
  const scr=hash(fr,44)<.35?(hash(fr,45)*W|0):-1;
  for(let y=0;y<H;y++){
    let sh=0;if(tr&&hash(y>>3,fr)<.35)sh=(hash(y>>4,fr+3)-.5)*60;
    const by=(y&3)*4;
    for(let x=0;x<W;x++){
      const i=y*W+x,o=i*4;let v=0;
      if(!black)v=layer(n,(x-180+sh+shx)/320*hh,(y-320+shy)/320*hh,t,hb,0,hh);
      v+=(hash(i,fr*7+1)-.5)*(black?.05:.15);
      if(x===scr)v+=.4*hash(y>>2,fr);
      const du=hash(i,fr*13);if(!black){if(du<.0004)v=1;else if(du>.9995)v=0}
      if(inv)v=1-v;
      const nx=(x-180)/180,ny=(y-320)/320;v*=1-.22*(nx*nx+ny*ny)*.5;
      let l=Math.floor(v*4+BAY[by+(x&3)]);l=l<0?0:l>4?4:l;
      if(md[o+1]>127)l=4;else if(md[o]>127)l=2;
      const c=PAL[l];px[o]=c[0];px[o+1]=c[1];px[o+2]=c[2];px[o+3]=255;
    }
  }
  oc.putImageData(img,0,0);
}

/* звук */
function buildAudio(ac,out,T0){
  const sr=ac.sampleRate,M=ac.createGain();M.gain.value=.9;M.connect(out);
  const nb=ac.createBuffer(1,sr*4,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=hash(i,77)*2-1;
  const src=b=>{const s=ac.createBufferSource();s.buffer=b;return s};
  const filt=(ty,f,q)=>{const b=ac.createBiquadFilter();b.type=ty;b.frequency.value=f;b.Q.value=q;return b};
  const A=x=>T0+x;
  function burst(t,d,f,q,g,ty){const s=src(nb),gg=ac.createGain();gg.gain.setValueAtTime(g,A(t));gg.gain.exponentialRampToValueAtTime(.0005,A(t+d));
    s.connect(filt(ty||'bandpass',f,q)).connect(gg).connect(M);s.start(A(t),(t*1.37)%3);s.stop(A(t+d+.03))}
  function tone(t,d,f,g,ty,f2){const o=ac.createOscillator(),gg=ac.createGain();o.type=ty||'sine';
    o.frequency.setValueAtTime(f,A(t));if(f2)o.frequency.exponentialRampToValueAtTime(f2,A(t+d));
    gg.gain.setValueAtTime(.0005,A(t));gg.gain.exponentialRampToValueAtTime(g,A(t+.008));gg.gain.exponentialRampToValueAtTime(.0005,A(t+d));
    o.connect(gg).connect(M);o.start(A(t));o.stop(A(t+d+.03))}
  /* бесконечный подъём: каждая октава = один зрачок */
  const NV=7,FMIN=35,END=38.8,RATE=50,NS=Math.floor(END*RATE);
  const lp=filt('lowpass',2600,.5);lp.connect(M);
  for(let v=0;v<NV;v++){
    const fc=new Float32Array(NS),gc=new Float32Array(NS);
    for(let i=0;i<NS;i++){const t=i/RATE,pos=((depth(t)+v)%NV+NV)%NV;
      fc[i]=FMIN*Math.pow(2,pos);gc[i]=Math.exp(-((pos-NV/2)**2)/(2*1.1*1.1))*(.05+.09*tension(t))*(1-sm(END-.4,END,t))}
    const o=ac.createOscillator(),gg=ac.createGain();o.type=v%2?'triangle':'sine';
    o.frequency.setValueCurveAtTime(fc,A(0),END);gg.gain.setValueCurveAtTime(gc,A(0),END);
    o.connect(gg).connect(lp);o.start(A(0));o.stop(A(END+.05));
  }
  for(let i=1;i<PH.length;i++){const a=PH[i-1]%1,b=PH[i]%1,t=i/100;if(t>=38.8)break;
    if(b<a)tone(t,.26,72,.8,'sine',28);else if(a<.17&&b>=.17)tone(t,.22,66,.45,'sine',28)}
  for(const c of CROSS){burst(c,.35,600,.7,.55,'lowpass');tone(c,.4,200,.35,'sine',50)}
  for(let fr=0;fr<38.8*FPS;fr++)if(tear(fr))burst(fr/FPS,.1+.12*hash(fr,6),1500+3000*hash(fr,7),1.4,.15+.25*tension(fr/FPS));
  burst(13,.25,380,1,.35);burst(27,.25,380,1,.35);burst(38.3,.4,350,1,.5);
  burst(39.6,.25,900,1,1);
  [1760,1873,2490].forEach(f=>{const o=ac.createOscillator(),gg=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
    o.type='sawtooth';o.frequency.value=f;l.frequency.value=31;lg.gain.value=f*.08;l.connect(lg).connect(o.frequency);
    gg.gain.setValueAtTime(.12,A(39.6));gg.gain.exponentialRampToValueAtTime(.001,A(40.1));
    o.connect(gg).connect(M);o.start(A(39.6));l.start(A(39.6));o.stop(A(40.15));l.stop(A(40.15))});
  tone(42.6,.3,72,.9,'sine',28);
}
async function audioWav(){
  const sr=44100,ctx=new OfflineAudioContext(2,sr*DUR,sr);buildAudio(ctx,ctx.destination,0);
  const ab=await ctx.startRendering(),L=ab.getChannelData(0),R=ab.getChannelData(1),n=L.length;
  const buf=new ArrayBuffer(44+n*4),dv=new DataView(buf),ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);
  dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);
  ws(36,'data');dv.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){dv.setInt16(44+i*4,Math.max(-1,Math.min(1,L[i]))*32767,true);dv.setInt16(46+i*4,Math.max(-1,Math.min(1,R[i]))*32767,true)}
  const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));
  return btoa(s);
}
window.renderFrame=renderFrame;window.audioWav=audioWav;window.DUR=DUR;window.FPS=FPS;

/* живой показ */
const gate=document.getElementById('gate');let ac=null,T0=0,st=0,lastFr=-1,run=false;
function loop(now){
  if(!run)return;requestAnimationFrame(loop);
  const t=ac?ac.currentTime-T0:(now-st)/1000;
  if(t>DUR){run=false;document.getElementById('gl').textContent='[ смотреть ещё раз ]';gate.hidden=false;return}
  const fr=Math.floor(Math.max(0,t)*FPS);if(fr!==lastFr){lastFr=fr;renderFrame(fr/FPS)}
}
gate.addEventListener('click',()=>{
  try{if(ac)ac.close();ac=new (window.AudioContext||window.webkitAudioContext)();T0=ac.currentTime+.1;buildAudio(ac,ac.destination,T0)}catch(e){ac=null}
  st=performance.now();lastFr=-1;gate.hidden=true;run=true;requestAnimationFrame(loop);
});
renderFrame(0);gate.focus();
})();
</script>
</body>
</html>
