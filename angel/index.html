<meta name="claude:viewport-fit-sides" content="cover">
<style>

#gate[hidden]{display:none}
#gate:focus-visible{outline:1px dashed var(--halo);outline-offset:-12px}
#gate .t{font-size:clamp(20px,6vw,34px);letter-spacing:.3em;color:var(--halo);text-transform:uppercase}
#gate .w{max-width:36ch;opacity:.55}
</style>
</head>

<canvas id="c" aria-label="A biblically accurate angel: burning wheels covered in eyes"></canvas>
<button id="gate" type="button">
  <span class="t">be not afraid</span>

</button>

function sFeathers(t,lt,p,L,E,F,fr){
  const k0=p.dark?.5:1;sAngel(t,90,46,.22,1,L*.75*k0,E,F,fr,.55+.15*Math.sin(t*.4),0);
  for(let k=0;k<22;k++){const sc=.35+1.6*hash(k,1)**2,sp=6+9*sc,fy=((hash(k,2)*420+(t-38)*sp)%420)-50,fx=hash(k,3)*W+14*Math.sin(t*.5+k*2)*sc;
    const ang=1.2+.9*Math.sin(t*.6+k)+hash(k,4)*3,x0=Math.max(0,(fx-22*sc)|0),x1=Math.min(W-1,(fx+22*sc)|0),y0=Math.max(0,(fy-22*sc)|0),y1=Math.min(H-1,(fy+22*sc)|0);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const f=feather(x,y,fx,fy,sc,ang,k);if(f>=0)B[y*W+x]=(f*(.5+.35*Math.min(1,sc))+.05)*L*k0}}
}
function sClouds(t,lt,L){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let v=(.2+.3*Math.pow(1-y/H,1.3))*L+.6*L*Math.exp(-Math.hypot(x-90,y+30)/150);
    for(let k=0;k<3;k++){const sp=22+k*34,n=fbm(x*.011*(k+1)+k*7,(y+t*sp)*.012*(k+1)+k*3),dn=sm(.45,.72,n);
      const sh=fbm(x*.011*(k+1)+k*7,(y-6+t*sp)*.012*(k+1)+k*3)-n,col=(.78-.14*k)*L+.3*L*Math.exp(-Math.hypot(x-90,y)/220)-.9*Math.max(0,-sh)*L;v=v*(1-dn*.9)+col*dn*.9}
    B[y*W+x]=v}
  const ax=90+30*Math.sin(t*.3),ay=-10+lt*14;const items=[];pushRings(items,t,ax,ay,.35,L*.9,E0,0,0,[0,1,2],.6,0);drawItems(items,t,E0);
}
let E0=0;
function sceneRun(t,fr,E,F){
  const L=1-.85*sm(74,84,t);E0=E;
  let i=0;while(i<SH.length-1&&t>=SH[i+1][0])i++;
  const [t0,type,p]=SH[i],lt=t-t0;
  if(type==='eye')sEye(t,lt,p,L,E,fr);
  else if(type==='swarm')sSwarm(t,lt,p,L,E,fr);
  else if(type==='ring')sRing(t,lt,p,L,E,F,fr);
  else if(type==='wide')sAngel(t,90,p.cy,p.S,p.unf,L,E,F,fr,1,0,p.sea?232:undefined);
  else if(type==='wing'){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=haze(x,y,t,L*.7,90,160,1);const w=wings(x,y,t+lt*.4,p.cx+lt*12,p.cy-lt*8,p.S,1,L,E);if(w>v)v=w;B[y*W+x]=v}}
  else if(type==='fly')sAngel(t,90,150,p.s0*Math.exp(p.k*lt),1,L,E,F,fr,1,sm(1.5,2.2,lt));
  else if(type==='feathers')sFeathers(t,lt,p,L,E,F,fr);
  else if(type==='clouds')sClouds(t,lt,L);
  else if(type==='core'||type==='ringcore'){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)B[y*W+x]=haze(x,y,t,L,90,158,3)+core(x,y,90,158,2.2,L,E)*.6;
    const items=[];pushRings(items,t*(type==='ringcore'?2.2:1),90,158,type==='ringcore'?1.3:2.15,L,E,F,fr,[0,1,2],1,1,null,.6);drawItems(items,t,E);
    bigEye(90,158,(type==='ringcore'?44:62)+5*E,type==='core'?sm(.2,1.6,lt):1,0,0,99,t,1)}
  else if(type==='away'){const S=1.5*Math.exp(-.45*lt),top=H+10-(H-130)*sm(0,5,lt);
    sAngel(t,90,150-25*sm(0,5,lt),S,1-.4*sm(2,5,lt),L,E,F,fr,1-sm(1,4.5,lt),0,top)}
  else{/* last eye closes in the dark */
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)B[y*W+x]=haze(x,y,t,.18,90,160,1);
    bigEye(90,160,58,1-sm(1.5,4.6,lt),0,0,99,t,.3)}
}
const CAPS=[[64,68,'BE NOT AFRAID']];
function text(t,fr){
  mc.clearRect(0,0,W,H);mc.textAlign='center';mc.textBaseline='middle';mc.font='bold 14px "Courier New",monospace';
  for(const [a,z,s] of CAPS)if(t>=a&&t<z&&hash(fr,5)>.1){const ox=(hash(fr,9)-.5)*1.4,oy=(hash(fr,19)-.5)*1.4;
    mc.fillStyle='rgb(255,0,0)';mc.fillText(s,W/2+1+ox,H*.8+1+oy);mc.fillStyle='rgb(0,255,0)';mc.fillText(s,W/2+ox,H*.8+oy)}
  return mc.getImageData(0,0,W,H).data;
}
function renderFrame(t){
  const fr=Math.round(t*FPS),md=text(t,fr),E=Es(t),F=mus(EN_F,t);
  sceneRun(t,fr,E,F);
  const flash=CUTS.some(c=>t>=c&&t<c+.17)?.35:0,tr=CUTS.some(c=>Math.abs(t-c)<.1);
  for(let y=0;y<H;y++){const by=(y&3)*4;for(let x=0;x<W;x++){
    const i=y*W+x,o=i*4;let v=Math.pow(Math.max(0,B[tr&&hash(y>>2,fr)<.4?y*W+Math.min(W-1,Math.max(0,x+(((hash(y>>3,fr+3)-.5)*30)|0))):i]),.9)+flash;
    v+=(hash(i,fr*7+1)-.5)*.12;const du=hash(i,fr*13);if(du<.0005)v=1;
    const nx=(x-90)/90,ny=(y-160)/160;v*=1-.28*(nx*nx+ny*ny)*.5;
    let l=Math.floor(v*4+BAY[by+(x&3)]);l=l<0?0:l>4?4:l;
    if(md[o+1]>127)l=4;else if(md[o]>127)l=1;
    const c=PAL[l];px[o]=c[0];px[o+1]=c[1];px[o+2]=c[2];px[o+3]=255}}
  oc.putImageData(img,0,0);
}
window.renderFrame=renderFrame;window.DUR=DUR;window.FPS=FPS;
const gate=document.getElementById('gate');let st=0,lastFr=-1,run=false;
function loop(now){if(!run)return;requestAnimationFrame(loop);const t=(now-st)/1000;
  if(t>DUR){run=false;document.getElementById('gl').textContent='[ watch again ]';gate.hidden=false;return}
  const fr=Math.floor(t*FPS);if(fr!==lastFr){lastFr=fr;renderFrame(fr/FPS)}}
gate.addEventListener('click',()=>{st=performance.now();lastFr=-1;gate.hidden=true;run=true;requestAnimationFrame(loop)});
renderFrame(30);gate.focus();
})();
</script>
