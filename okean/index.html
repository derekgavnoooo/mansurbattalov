<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Глубина</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* вертикальный кадр 9:16: ночной океан и бездна; 180×320 точек, 5 тонов холодной воды, дизер 4×4 */
:root{
  --abyss:#020408; --deep:#08141e; --sea:#18343e; --foam:#567876; --light:#d6e2d2;
  --mono:"Courier New",Courier,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--light);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#gate{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;border:0;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--abyss);color:var(--light);font:13px/1.6 var(--mono);text-align:center;cursor:pointer}
#gate[hidden]{display:none}
#gate:focus-visible{outline:1px dashed var(--foam);outline-offset:-12px}
#gate .t{font-size:clamp(20px,6vw,34px);letter-spacing:.4em;color:var(--foam);text-transform:uppercase}
#gate .w{max-width:36ch;opacity:.55}
</style>
</head>
<body>
<canvas id="c" aria-label="Ночной океан, лодка, маяк и существо из глубины"></canvas>
<button id="gate" type="button">
  <span class="t">глубина</span>
  <span id="gl">[ смотреть ]</span>
  <span class="w">Здесь без звука. Звук есть в видеоверсии.</span>
</button>
<script>
(()=>{
const W=180,H=320,DUR=45,FPS=12,TAU=Math.PI*2;
const PAL=[[2,4,8],[8,20,30],[24,52,62],[86,120,118],[214,226,210]];
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;
  h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vn(x,y)*.5+vn(x*2.03+5.2,y*2.03+1.3)*.25+vn(x*4.01+9.1,y*4.01+3.7)*.125}
function fbm5(x,y){return fbm(x,y)*.8+vn(x*8.1+2.3,y*8.1+7.7)*.07+vn(x*16.3+1.1,y*16.3+4.4)*.035}
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const EN=window.LANG==='en'||location.hash==='#en';

/* ---------- над водой ---------- */
const H0=128,LX=52,FOC=60;
const OBJ=[[3.5,3.2,14,46,6,1,.3,1],[6.5,3,-11,30,5,1.6,0,2],[9,2.6,6,24,7,.8,.6,3],[9.6,2.4,8.5,24,5,.7,-.4,4],[11.8,3.4,-4,13,9,1,.8,5]];
for(let k=0;k<9;k++)OBJ.push([14.6+k*.35,2.6,-14+k*3,8.5,4+3*hash(k,77),.9,.15,10+k]);
OBJ.push([18.3,2.4,1.5,3.2,14,1.3,.9,30]);
function roll(t){return (.035*Math.sin(.8*t)+.02*Math.sin(1.7*t+1))*(1+1.5*sm(14,19,t))+1.9*Math.pow(sm(20,21.4,t),2)}
function bob(t){return 3*Math.sin(.9*t)*(1+sm(14,19,t))+160*sm(20.3,21.5,t)}
const beamA=t=>t*1.1;
function above(x,y,t){
  const a=roll(t),c=Math.cos(a),s=Math.sin(a),dx=x-90,dy=y-230;
  const sx=90+dx*c-dy*s,sy=230+dx*s+dy*c-bob(t);
  const th=beamA(t),face=Math.pow(Math.max(0,Math.cos(th)),8);
  let v;
  if(sy<H0){
    v=.05+.08*(sy/H0)+.09*fbm(sx*.02+t*.01,sy*.05);
    v+=.08*Math.exp(-Math.hypot(sx-140,sy-40)/18);
    const lx=LX,ly=H0-22,bd=[Math.sin(th),-.05],ox=sx-lx,oy=sy-ly,al=ox*bd[0]+oy*bd[1];
    if(al>0){const pr=Math.abs(ox*bd[1]-oy*bd[0]);v+=.22*Math.exp(-pr*pr/(2*(1+al*.09)**2))*Math.exp(-al/150)}
    if(sy>H0-22&&Math.abs(sx-lx)<1.6+(sy-(H0-22))*.07)v=.03+.04*((sy|0)%5<2?1:0);
    const ld=Math.hypot(sx-lx,sy-ly);v+=(.6+1.4*face)*Math.exp(-ld*ld/3)+(.06+.35*face)*Math.exp(-ld/10);
  }else{
    const d=sy-H0,z=FOC/(d+.6),u=(sx-90)*z*.05;
    const w=fbm(u*.22+t*.04,z*1.1-t*.3)+.5*fbm(u*.6+3,z*2.6-t*.5);
    v=.05+.06*w+.06*Math.exp(-d/8);
    let glint=w>.85?(w-.85)*1.4:0;
    const rw=1+d*.2;v+=Math.exp(-Math.abs(sx-LX)/rw)*(.03+.5*face)*sm(.68,.85,w)*Math.exp(-d/45);
    if(t>14&&t<19){const S=FOC/7.5,mx=90+(-22+(t-14)*8)*S,my=H0+S,q=((sx-mx)/(S*11))**2+((sy-my)/(S*1.1))**2;
      const k=1-sm(.6,1,q);v*=1-.65*k;glint*=1-k}
    v+=glint;
    for(const [t0,dur,X,Z,h,w2,bend,sd] of OBJ){if(t<t0||t>t0+dur+2)continue;
      const S=FOC/Z,bx=90+X*S,by=H0+S,rr=(t-t0)*.9+.2,q=Math.hypot((sx-bx)/(S*w2*2.2),(sy-by)/(S*w2*.55));
      v+=.14*Math.exp(-(((q-rr)/.18)**2))*Math.exp(-(t-t0)/3)}
  }
  for(const [t0,dur,X,Z,h,w2,bend,sd] of OBJ){
    if(t<t0||t>t0+dur)continue;
    const e=sm(t0,t0+dur*.35,t)*(1-sm(t0+dur*.65,t0+dur,t)),S=FOC/Z,bx=90+X*S,by=H0+S;
    const ry=(by-sy)/(h*1.4*S);if(ry<0||ry>e)continue;
    const r=ry+(1-e),wd=w2*1.3*S*.5*Math.pow(Math.max(0,1-r),.6)*(1+.4*(fbm(r*6+sd,t*.5)-.5));
    const off=bend*S*h*1.4*r*r*(.3*Math.sin(t*1.2+sd)+1)*.35;
    const ox=sx-(bx+off);
    if(Math.abs(ox)<wd){v=.015+.05*fbm(r*14+sd,ox*.5)+(ox<-wd*.4?.09*face+.03:0)}
  }
  if(t>20.5&&t<21.7){const k=Math.sin(Math.PI*sm(20.5,21.7,t));v=Math.max(v,sm(.55,.72,fbm(x*.08+t*3,y*.08-t*5))*k*.95)}
  /* борт лодки внизу кадра */
  const gy=284+320*sm(20.5,21.2,t)+9*((x-90)/90)**2+3*(fbm(x*.04,7)-.5),gd=y-gy;
  if(gd>0){let b=.04+.05*fbm(x*.15,y*.04)+.02*Math.max(0,Math.sin(y*.9+fbm(x*.05,y*.1)*3));
    if(gd<5)b=.09+.12*(1-gd/5)*(.7+.6*fbm(x*.3,y*.3));
    v=b+.05*face*(gd<5?1:.3)}
  return v;
}

/* ---------- под водой ---------- */
const BUB=[];for(let k=0;k<70;k++){const late=k>55;BUB.push([10+160*hash(k,1),late?24+hash(k,2)*14:21.6+hash(k,2)*2.6,25+35*hash(k,3),.8+1.6*hash(k,4)])}
function eye(v,x,y,R,open,seed,t){
  const dx=x/R,dy=y/R,ax=Math.abs(dx);
  if(ax>1.5||Math.abs(dy)>1.25)return v;
  const sh=ax<1?Math.pow(1-dx*dx,.8):0,nt=fbm(dx*2.2+seed,t*.25),nb=fbm(dx*2.2+seed+9,t*.2);
  const top=-(.58*open*sh)*(.8+.4*nt),bot=(.42*open*sh)*(.8+.4*nb);
  const dTop=dy-top,dBot=bot-dy,inside=Math.min(dTop,dBot);
  if(inside<=0){if(ax<1.3){const out=-inside,fold=dy<0?Math.abs(out-.17-.06*nt):Math.abs(out-.13-.05*nb);
    v-=Math.exp(-fold*fold/.0018)*(1-ax*.6)*.05}return v}
  const ir=Math.hypot(dx,dy),ang=Math.atan2(dy,dx),Rir=.43*(1+.1*(fbm(ang*1.3+seed,t*.05)-.5)),Rp=.13*(.96+.12*(fbm(ang*1.7,t*.3)-.5));
  const w=fbm(x*.9+seed,y*.9),vv=fbm5(x*1.1+w*1.5,y*1.1-w*1.5),vein=Math.max(0,1-Math.abs(vv-.5)*10)*(.45+.6*ax);
  const s=.62+.14*fbm(x*.5,y*.5)-vein*.4-ax*ax*.28;
  const q=fbm5(ang*5+fbm(ir*9+seed,ang*2)*1.8+seed,ir*12+seed),iv=(.25+.4*q)*(.5+.5*sm(Rir,Rir*.7,ir)),ib=sm(Rir*1.07,Rir*.9,ir);
  let e=s*(1-ib)+iv*ib;const pb=sm(Rp*1.12,Rp*.9,ir);e=e*(1-pb)+.01*pb;
  e*=.4+.6*sm(0,.2,dTop);e*=.55+.45*sm(0,.12,dBot);
  return v*(1-sm(0,.04,inside))+e*sm(0,.04,inside);
}
const DOTS=[];for(let k=0;k<34;k++){const a=k/34*TAU+hash(k,9)*.15,r=.86+.1*hash(k,8);DOTS.push([3.4*r*Math.cos(a),2.6*r*Math.sin(a),hash(k,7)*6])}
for(let k=0;k<14;k++)DOTS.push([(hash(k,5)-.5)*5,(hash(k,6)-.5)*3.6,hash(k,4)*6]);
function below(x,y,t){
  const u=t-21.6,ys=70-u*13,ysx=ys+4*Math.sin(x*.07+t*2)+6*(fbm(x*.04,t*.6)-.5);
  let v;
  if(y<ysx){v=.32+.3*fbm(x*.05+t*.2,y*.08)+.35*sm(.6,.8,fbm(x*.09+fbm(x*.03,t*.3)*2,t*.4));
    const hx=(x-102)/40,hy=(y-ysx+3)/8;if(hx*hx+hy*hy<1)v=.03}
  else{const amb=.13*Math.exp(-u/4.5);
    v=.02+amb*Math.exp(-(y-Math.max(ys,0))/110);
    const rays=fbm(x*.045+y*.012,t*.12);v+=(.12*Math.exp(-u/5))*sm(.5,.78,rays)*Math.exp(-(y-ys)/160)}
  if(hash(Math.floor((x+t*3)/2),Math.floor((y+t*7)/2))>.996)v+=.18*Math.exp(-u/12)+.05;
  /* существо */
  if(t>=28.5){
    const S=Math.min(260,18*Math.exp(.25*(t-29))),f=.6*sm(33,39,t),yo=(1-sm(29,35,t))*80;
    const ux=(x-90)/S,uy=(y-160-yo)/S+f,vis=.25+.6*sm(30,38,t)*1;
    const ang=Math.atan2(uy,ux),e=Math.hypot(ux/3.4,uy/2.6)*(1+.12*(fbm(ang*2+3,t*.2)-.5));
    if(e<1.05){
      let cv=.05+.05*fbm5(ux*2,uy*2)+.025*fbm(ux*9,uy*9);
      cv=eye(cv,ux*8,(uy+.9)*8,6,sm(29.5,31,t),3,t);
      const m=Math.pow(sm(33,39,t),1.2),mry=1.5*m+.04,em=Math.hypot(ux/2.4,(uy-.65)/mry);
      if(em<1.08){
        if(em>=1)cv*=.5;else{
          const th=Math.atan2((uy-.65)/mry,ux/2.4),qq=(th+Math.PI)/TAU*34,k=Math.floor(qq),uu=qq-k;
          const cu=uu+(1-em)*(hash(k,5)-.5)*3+.3*(fbm(ux*3+k,uy*3)-.5)+.12*(fbm(ux*11,uy*11)-.5);
          const tp=Math.max(0,1-Math.abs(cu-.5)/(.22+.3*hash(k,11))),len=(.1+.26*hash(k,7))*Math.pow(tp,.6)*(1+.7*(fbm(k*1.7,em*6+ux)-.5));
          cv=em>1-len&&hash(k,13)>.15?.1+.12*fbm(ux*16,uy*16)+.05*fbm(ux*40,uy*40)-(1-em)/Math.max(.01,len)*.08:.004+.01*fbm(ux*5,uy*5)}}
      const soft=1-sm(.92,1.05,e);
      v=v*(1-soft*vis)+cv*soft*vis;
    }
    const dv=sm(30.5,33,t);
    if(dv>0)for(const [px,py,ph] of DOTS){const d=Math.hypot(ux-px,uy-py);if(d<.4)v+=dv*.7*(.6+.4*Math.sin(t*2+ph))*Math.exp(-d*d/(2*.055*.055))}
  }
  /* пузыри */
  for(const [bx0,tb,sp,r] of BUB){if(t<tb)continue;const by=330-sp*(t-tb);if(by<-5||Math.abs(y-by)>r+1)continue;
    const bx=bx0+3*Math.sin((t-tb)*4+bx0);const d=Math.hypot(x-bx,(y-by)*1.1);if(d<r)v=Math.max(v,d>r*.55?.55:.25)}
  return v;
}

/* ---------- кадр ---------- */
const out=document.getElementById('c');out.width=W;out.height=H;
const oc=out.getContext('2d',{alpha:false}),img=oc.createImageData(W,H),px=img.data;
const mask=document.createElement('canvas');mask.width=W;mask.height=H;const mc=mask.getContext('2d',{willReadFrequently:true});
const CAPS=EN?[[1,5.5,'the lighthouse|is still far'],[26,29,"don't look down"],[41,45.5,'depth below you|4 kilometers']]
            :[[1,5.5,'до маяка|ещё далеко'],[26,29,'не смотри вниз'],[41,45.5,'глубина под тобой|4 километра']];
function text(t,fr){
  mc.clearRect(0,0,W,H);mc.textAlign='center';mc.textBaseline='middle';mc.font='bold 11px "Courier New",monospace';
  for(const [a,z,s] of CAPS)if(t>=a&&t<z&&(hash(fr,5)>.12||a>40)){
    s.split('|').forEach((l,k)=>{const y=(a>40?H*.47:a>20?H*.2:H*.13)+k*15,ox=(hash(fr,k+9)-.5)*1.2,oy=(hash(fr,k+19)-.5)*1.2;
      mc.fillStyle='rgb(255,0,0)';mc.fillText(l,W/2+1+ox,y+1+oy);mc.fillStyle='rgb(0,255,0)';mc.fillText(l,W/2+ox,y+oy)});
  }
  return mc.getImageData(0,0,W,H).data;
}
const tear=fr=>{const t=fr/FPS;return hash(fr,31)<.015+(t>21&&t<39.4?.06*sm(28,39,t):0)||Math.abs(t-21.6)<.15};
function renderFrame(t){
  const fr=Math.round(t*FPS),md=text(t,fr),black=t>=39.4,tr=tear(fr);
  const scr=hash(fr,44)<.3?(hash(fr,45)*W|0):-1;
  for(let y=0;y<H;y++){
    let sh=0;if(tr&&hash(y>>2,fr)<.35)sh=(hash(y>>3,fr+3)-.5)*24;
    const by=(y&3)*4;
    for(let x=0;x<W;x++){
      const i=y*W+x,o=i*4;let v=0;
      if(!black)v=t<21.6?above(x+sh,y,t):below(x+sh,y,t);
      v=Math.pow(Math.max(0,v),.6);
      v+=(hash(i,fr*7+1)-.5)*(black?.04:.13);
      if(x===scr&&!black)v+=.3*hash(y>>2,fr);
      const nx=(x-90)/90,ny=(y-160)/160;v*=1-.3*(nx*nx+ny*ny)*.5;
      let l=Math.floor(v*4+BAY[by+(x&3)]);l=l<0?0:l>4?4:l;
      if(md[o+1]>127)l=4;else if(md[o]>127)l=1;
      const c=PAL[l];px[o]=c[0];px[o+1]=c[1];px[o+2]=c[2];px[o+3]=255;
    }
  }
  oc.putImageData(img,0,0);
}
window.renderFrame=renderFrame;window.DUR=DUR;window.FPS=FPS;

const gate=document.getElementById('gate');let st=0,lastFr=-1,run=false;
function loop(now){
  if(!run)return;requestAnimationFrame(loop);const t=(now-st)/1000;
  if(t>DUR){run=false;document.getElementById('gl').textContent='[ смотреть ещё раз ]';gate.hidden=false;return}
  const fr=Math.floor(t*FPS);if(fr!==lastFr){lastFr=fr;renderFrame(fr/FPS)}
}
gate.addEventListener('click',()=>{st=performance.now();lastFr=-1;gate.hidden=true;run=true;requestAnimationFrame(loop)});
renderFrame(2);gate.focus();
})();
</script>
</body>
</html>
