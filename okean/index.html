<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Глубина</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* вертикальный кадр 9:16: ночной океан и бездна; 180×320 точек, 5 тонов холодной воды, дизер 4×4 */
:root{
  --abyss:#020408; --deep:#08141e; --sea:#18343e; --foam:#567876; --light:#d6e2d2;
  --mono:"Courier New",Courier,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--light);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#gate{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;border:0;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--abyss);color:var(--light);font:13px/1.6 var(--mono);text-align:center;cursor:pointer}
#gate[hidden]{display:none}
#gate:focus-visible{outline:1px dashed var(--foam);outline-offset:-12px}
#gate .t{font-size:clamp(20px,6vw,34px);letter-spacing:.4em;color:var(--foam);text-transform:uppercase}
#gate .w{max-width:36ch;opacity:.55}
</style>
</head>
<body>
<canvas id="c" aria-label="Ночной океан, лодка, маяк и существо из глубины"></canvas>
<button id="gate" type="button">
  <span class="t">глубина</span>
  <span id="gl">[ смотреть ]</span>
  <span class="w">Здесь без звука. Звук есть в видеоверсии.</span>
</button>
<script>
(()=>{
const W=180,H=320,DUR=45,FPS=12,TAU=Math.PI*2;
const PAL=[[2,4,8],[8,20,30],[24,52,62],[86,120,118],[214,226,210]];
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;
  h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y){return vn(x,y)*.5+vn(x*2.03+5.2,y*2.03+1.3)*.25+vn(x*4.01+9.1,y*4.01+3.7)*.125}
function fbm5(x,y){return fbm(x,y)*.8+vn(x*8.1+2.3,y*8.1+7.7)*.07+vn(x*16.3+1.1,y*16.3+4.4)*.035}
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const EN=window.LANG==='en'||location.hash==='#en';

/* ---------- над водой ---------- */
const H0=128,LX=52,FOC=60,MX=128,MY=42;
const OBJ=[[3.5,3.2,12,46,6,1,.3,1],[6.5,3,-11,30,5,1.6,0,2],[9,2.6,10,24,7,.8,.6,3],[9.6,2.4,13,24,5,.7,-.4,4],[11.8,3.4,6,13,9,1,.8,5]];
for(let k=0;k<9;k++)OBJ.push([14.6+k*.35,2.6,-14+k*3.4,8.5,4+3*hash(k,77),.9,.15,10+k]);
OBJ.push([18.3,2.4,1.5,3.2,14,1.3,.9,30]);
function roll(t){return (.035*Math.sin(.8*t)+.02*Math.sin(1.7*t+1))*(1+1.5*sm(14,19,t))+1.25*Math.pow(sm(19.8,21.3,t),1.6)}
function bob(t){return 3*Math.sin(.9*t)*(1+sm(14,19,t))+190*Math.pow(sm(20.4,21.5,t),2)}
const beamA=t=>t*1.1;
function above(x,y,t){
  const a=roll(t),c=Math.cos(a),s=Math.sin(a),dx=x-90,dy=y-230;
  const sx=90+dx*c-dy*s,sy=230+dx*s+dy*c-bob(t);
  const th=beamA(t),face=Math.pow(Math.max(0,Math.cos(th)),8);
  let v;
  if(sy<H0){
    v=.13+.12*Math.pow(sy/H0,2);
    const cl=fbm(sx*.014+t*.008,sy*.045);v+=.16*sm(.45,.75,cl)*(.5+.5*Math.exp(-Math.hypot(sx-MX,sy-MY)/60))-.05*sm(.3,.45,cl);
    const md=Math.hypot(sx-MX,sy-MY);v+=.3*Math.exp(-md/14);if(md<5.5+.6*(fbm(sx*.5,sy*.5)-.5))v=.95-.15*fbm(sx*.6,sy*.6);
    if(sy>H0-2.5)v+=.06;
    const lx=LX,ly=H0-22,bd=[Math.sin(th),-.05],ox=sx-lx,oy=sy-ly,al=ox*bd[0]+oy*bd[1];
    if(al>0){const pr=Math.abs(ox*bd[1]-oy*bd[0]);v+=.25*Math.exp(-pr*pr/(2*(1+al*.09)**2))*Math.exp(-al/150)}
    if(sy>H0-22&&Math.abs(sx-lx)<1.6+(sy-(H0-22))*.07)v=.03+.03*((sy|0)%5<2?1:0);
    const ld=Math.hypot(sx-lx,sy-ly);v+=(.6+1.4*face)*Math.exp(-ld*ld/3)+(.05+.35*face)*Math.exp(-ld/10);
  }else{
    const d=sy-H0,z=FOC/(d+.6),u=(sx-90)*z*.05;
    const w=fbm(u*.22+t*.04,z*1.1-t*.3)+.5*fbm(u*.6+3,z*2.6-t*.5),w2=fbm(u*.9+7,z*4-t*.7);
    v=.025+.03*w;
    const path=Math.exp(-Math.abs(sx-MX)/(1.5+d*.42));
    let gl=sm(.38,.62,w2*.6+w*.35)*path*1.4+sm(.78,.9,w2)*.2*Math.exp(-d/70);
    gl+=Math.exp(-Math.abs(sx-LX)/(1+d*.2))*.5*face*sm(.6,.8,w2)*Math.exp(-d/45);
    if(t>14&&t<19){const S=FOC/7.5,mx=90+(-22+(t-14)*8)*S,my=H0+S,q=((sx-mx)/(S*11))**2+((sy-my)/(S*1.1))**2;
      const k=1-sm(.6,1,q);v*=1-.65*k;gl*=1-k}
    v+=gl;
    for(const [t0,dur,X,Z,h,w3,bend,sd] of OBJ){if(t<t0||t>t0+dur+2)continue;
      const S=FOC/Z,bx=90+X*S,by=H0+S,rr=(t-t0)*.9+.2,q=Math.hypot((sx-bx)/(S*w3*2.2),(sy-by)/(S*w3*.55));
      v+=.18*Math.exp(-(((q-rr)/.18)**2))*Math.exp(-(t-t0)/3)}
  }
  for(const [t0,dur,X,Z,h,w2,bend,sd] of OBJ){
    if(t<t0||t>t0+dur)continue;
    const e=sm(t0,t0+dur*.35,t)*(1-sm(t0+dur*.65,t0+dur,t)),S=FOC/Z,bx=90+X*S,by=H0+S;
    const ry=(by-sy)/(h*1.4*S);if(ry<0||ry>e)continue;
    const r=ry+(1-e),wd=w2*1.3*S*.5*Math.pow(Math.max(0,1-r),.6)*(1+.4*(fbm(r*6+sd,t*.5)-.5));
    const off=bend*S*h*1.4*r*r*(.3*Math.sin(t*1.2+sd)+1)*.35,ox=sx-(bx+off);
    if(Math.abs(ox)<wd)v=.01+.03*fbm(r*14+sd,ox*.5)+(ox>wd*.35?.07:0)+(ox<-wd*.4?.08*face:0);
  }
  if(t>20.6&&t<21.7){const k=Math.sin(Math.PI*sm(20.6,21.7,t));v=Math.max(v,sm(.5,.7,fbm(x*.08+t*3,y*.08-t*5))*k*.95)}
  const gy=284+340*sm(20.5,21.1,t)+9*((x-90)/90)**2+3*(fbm(x*.04,7)-.5),gd=y-gy;
  if(gd>0){let b=.04+.05*fbm(x*.15,y*.04)+.02*Math.max(0,Math.sin(y*.9+fbm(x*.05,y*.1)*3));
    if(gd<5)b=.12+.14*(1-gd/5)*(.7+.6*fbm(x*.3,y*.3));
    v=b+.05*face*(gd<5?1:.3)}
  return v;
}

/* ---------- под водой: та же перспектива, камера тонет ---------- */
const FU=110;
function pitchAt(t){return -.38+1.3*sm(22.2,24.6,t)}
function creatureA(x,y,t,v,ax,ay,s){
  const lx=(x-ax)/s,ly=(y-ay)/s,sA=lx/15;if(Math.abs(sA)>1.2||Math.abs(ly)>7)return v;
  const bend=1.6*Math.sin(sA*2.2-t*1.4),th=3*Math.pow(Math.max(0,1-sA*sA),.45)*(1+.35*sA)*(1+.45*(fbm(sA*3+1,t*.1)-.5));
  let e=Math.abs(ly-bend)-th+.9*(fbm(lx*.5,ly*.5)-.5)+.3*(fbm(lx*2,ly*2)-.5);
  if(ly<bend)e-=1.3*Math.pow(Math.max(0,Math.sin(lx*1.25+2*fbm(lx*.3,1))),7)*(1-Math.abs(sA));
  if(e>=0)return v;
  let c=.05+.06*fbm5(lx*.7,ly*.7);if(ly-bend<-th*.5)c+=.06*(.5+fbm(lx*.4,ly));if(e>-.35)c+=.05;
  const gx=Math.floor(lx/1.7),gy=Math.floor(ly/1.7);
  if(hash(gx+300,gy)<.3){const cx=(gx+.2+.6*hash(gx,gy+1))*1.7,cy=(gy+.2+.6*hash(gx+2,gy))*1.7,d2=(lx-cx)**2+(ly-cy)**2;c+=.9*Math.exp(-d2/.12)*(.6+.4*Math.sin(t*3+gx))}
  const ed=Math.hypot(lx-12.6,ly-(bend-.6));if(ed<.55)c=Math.abs(lx-12.6)<.07?.02:.4*(1-ed/.55)+.1;
  return v*.15+c;
}
const BEYE=[[-3.4,-2.2,.55],[2.9,-3.1,.38],[-1.1,-3.8,.22],[4.1,-1.2,.18]];
function creatureB(x,y,t,v,ax,ay,s,vis,m){
  const lx=(x-ax)/s,ly=(y-ay)/s;let out=v;
  const ex=1.5+.7*Math.sin(t*1.3),ey=-9+.5*Math.cos(t*1.1),ld=Math.hypot(lx-ex,ly-ey);
  const lure=1.2*Math.exp(-ld*ld/(2*.32*.32))+.22*Math.exp(-ld/1.3);
  const r=Math.hypot(lx,ly*1.15),th=Math.atan2(ly*1.15,lx);
  if(r<11){
    const R=6.2*(1+.32*(fbm(th*1.1+3,1.7)-.5)*2+.14*(fbm(th*3.7,4)-.5));
    const e=r-R+.6*(fbm(lx*.6,ly*.6)-.5);
    const sx2=lx-(1+.25*(ey+5.5)),sy2=ly+5.5;
    if(sy2<0&&sy2>ey+5.5&&Math.abs(lx-(1+(ex-1)*((-sy2)/(5.5-(-ey))**.5)))<.12)out=out*.6;
    if(e<0){
      let c=.05+.06*fbm5(lx*.5,ly*.5);if(ly<-R*.55)c+=.05;if(e>-.4)c+=.05;
      const gx=Math.floor(lx/1.4),gy=Math.floor(ly/1.4);
      if(hash(gx+700,gy)<.16){const cx=(gx+.2+.6*hash(gx,gy+3))*1.4,cy=(gy+.2+.6*hash(gx+4,gy))*1.4;c+=.6*Math.exp(-((lx-cx)**2+(ly-cy)**2)/.05)}
      const op=sm(31.6,32.6,t);
      for(const [bx,by,br] of BEYE){const d=Math.hypot(lx-bx,(ly-by)/Math.max(.05,op));if(d<br)c=Math.abs(lx-bx)<br*.13?.02:.25+.6*Math.sqrt(1-d/br)}
      const mx=lx+.6,my=ly-1.2,rm=Math.hypot(mx/1.35,my),tm=Math.atan2(my,mx/1.35);
      const Rm=m*4.4*(1+.38*(fbm(tm*1.6+7,t*.1)-.5)*2)+.05;
      if(rm<Rm*1.08){
        if(rm>=Rm)c*=.4;else{c=.003;
          const kk=(tm+Math.PI)/TAU*23+1.7*(fbm(tm*2.5,2)-.5),k=Math.floor(kk),uu=kk-k,len=Rm*(.08+.55*hash(k,7)**1.5),al=(Rm-rm)/len;
          if(al<1&&hash(k,13)>.25){const cu=uu+al*(hash(k,5)-.5)*1.8+.25*(fbm(rm*3,k)-.5),wd=.1*Math.pow(1-al,.8);if(Math.abs(cu-.5)<wd)c=.22+.15*fbm(lx*6,ly*6)}}}
      out=out*(1-vis)+c*vis;
    }
  }
  return out+lure*sm(30.5,31.5,t);
}
function underBuf(t,buf){
  const u=t-21.6,D=1.2+u*1.1,p=pitchAt(t),cp=Math.cos(p),sp=Math.sin(p),amb=Math.exp(-u/4.2);
  const wA=[-26+(t-26)*9.5,16,24],aA=[wA[0],wA[1]*cp-wA[2]*sp,wA[1]*sp+wA[2]*cp];
  const showA=false,sA=FU/aA[2],axA=90+aA[0]*sA,ayA=160+aA[1]*sA;
  const showB=t>=30.5,Zb=Math.max(.9,104*Math.exp(-.54*(t-30.5))),sB=FU/Zb;
  const axB=90+18*Math.sin(t*.4)*(1-sm(33,38,t))+.6*sB*sm(35,39,t),ayB=215+(160-215)*sm(31,36,t)-1.2*sB*sm(34,38.5,t);
  const visB=.45+.5*sm(32,35,t),mB=Math.pow(sm(33.3,37.5,t),.9);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const rx=(x-90)/FU,ry=(y-160)/FU,dx=rx,dy=ry*cp+sp,dz=-ry*sp+cp,L=Math.hypot(dx,dy,dz),ny=dy/L;
    let v=(.02+.08*amb)*(.3+.7*sm(.7,-.7,ny));
    if(dy<0){const ts=D/(-dy),wx=dx*ts,wz=dz*ts,fo=Math.exp(-ts*L/14);
      const c=fbm(wx*.22+fbm(wx*.07,wz*.07+t*.15)*2.2,wz*.22+t*.25);
      let sv=(.22+.78*sm(.5,.78,c))*(.45+.55*amb);
      const bx=(wx-.4)/1.2,bz=(wz-3.2)/2.8;if(bx*bx+bz*bz<1+.25*(fbm(wx*2,wz*2)-.5))sv=.015;
      v=v*(1-fo)+sv*fo}
    v+=.1*amb*sm(.55,.85,fbm(Math.atan2(dx,dz)*7+3,t*.08))*(1-sm(-.3,.5,ny))*(1-sm(.3,.9,ny));
    if(showA)v=creatureA(x,y,t,v,axA,ayA,sA);
    if(showB)v=creatureB(x,y,t,v,axB,ayB,sB,visB,mB);
    buf[y*W+x]=v;
  }
  const dot=(sx,sy,b,r)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const X=Math.round(sx)+i,Y=Math.round(sy)+j;
    if(X>=0&&X<W&&Y>=0&&Y<H&&i*i+j*j<=r*r+.5)buf[Y*W+X]+=b*(r&&i*i+j*j<r*r-.5?.35:1)}};
  for(let k=0;k<260;k++){
    const x0=(hash(k,1)-.5)*14,z0=1+hash(k,3)*14,yw=((hash(k,2)*14-u*1.6*(.6+.4*hash(k,5)))%14+14)%14-7;
    const cy=yw*cp-z0*sp,cz=yw*sp+z0*cp;if(cz<.4)continue;
    dot(90+x0/cz*FU,160+cy/cz*FU,.35*Math.exp(-cz/9)*(.5+.5*amb)+.05,cz<2?1:0)}
  for(let k=0;k<55;k++){const tb=21.6+hash(k,7)*2.4;if(t<tb)continue;
    const x0=(hash(k,8)-.5)*4,z0=.8+hash(k,9)*4,yw=2-(2+2.5*hash(k,10))*(t-tb);if(yw<-6)continue;
    const cy=yw*cp-z0*sp,cz=yw*sp+z0*cp;if(cz<.3)continue;
    dot(90+x0/cz*FU,160+cy/cz*FU,.4,Math.max(1,Math.min(4,Math.round(.12/cz*FU*.2))))}
}

/* ---------- кадр ---------- */
const out=document.getElementById('c');out.width=W;out.height=H;
const oc=out.getContext('2d',{alpha:false}),img=oc.createImageData(W,H),px=img.data,UB=new Float32Array(W*H);
const mask=document.createElement('canvas');mask.width=W;mask.height=H;const mc=mask.getContext('2d',{willReadFrequently:true});
const CAPS=EN?[[1,5.5,'the lighthouse|is still far'],[24,27,"don't look down"],[41,45.5,'depth below you|4 kilometers']]
            :[[1,5.5,'до маяка|ещё далеко'],[24,27,'не смотри вниз'],[41,45.5,'глубина под тобой|4 километра']];
function text(t,fr){
  mc.clearRect(0,0,W,H);mc.textAlign='center';mc.textBaseline='middle';mc.font='bold 11px "Courier New",monospace';
  for(const [a,z,s] of CAPS)if(t>=a&&t<z&&(hash(fr,5)>.12||a>40)){
    s.split('|').forEach((l,k)=>{const y=(a>40?H*.47:a>20?H*.2:H*.22)+k*15,ox=(hash(fr,k+9)-.5)*1.2,oy=(hash(fr,k+19)-.5)*1.2;
      mc.fillStyle='rgb(255,0,0)';mc.fillText(l,W/2+1+ox,y+1+oy);mc.fillStyle='rgb(0,255,0)';mc.fillText(l,W/2+ox,y+oy)});
  }
  return mc.getImageData(0,0,W,H).data;
}
const tear=fr=>{const t=fr/FPS;return hash(fr,31)<.015+(t>21&&t<39.4?.06*sm(28,39,t):0)||Math.abs(t-21.6)<.15};
function renderFrame(t){
  const fr=Math.round(t*FPS),md=text(t,fr),black=t>=39.4,tr=tear(fr),uw=t>=21.6&&!black;
  if(uw)underBuf(t,UB);
  const scr=hash(fr,44)<.3?(hash(fr,45)*W|0):-1;
  for(let y=0;y<H;y++){
    let sh=0;if(tr&&hash(y>>2,fr)<.35)sh=((hash(y>>3,fr+3)-.5)*24)|0;
    const by=(y&3)*4;
    for(let x=0;x<W;x++){
      const i=y*W+x,o=i*4;let v=0;
      if(!black)v=uw?UB[y*W+Math.min(W-1,Math.max(0,x+sh))]:above(x+sh,y,t);
      v=Math.pow(Math.max(0,v),.6);
      v+=(hash(i,fr*7+1)-.5)*(black?.04:.12);
      if(x===scr&&!black)v+=.3*hash(y>>2,fr);
      const nx=(x-90)/90,ny=(y-160)/160;v*=1-.3*(nx*nx+ny*ny)*.5;
      let l=Math.floor(v*4+BAY[by+(x&3)]);l=l<0?0:l>4?4:l;
      if(md[o+1]>127)l=4;else if(md[o]>127)l=1;
      const c=PAL[l];px[o]=c[0];px[o+1]=c[1];px[o+2]=c[2];px[o+3]=255;
    }
  }
  oc.putImageData(img,0,0);
}
window.renderFrame=renderFrame;window.DUR=DUR;window.FPS=FPS;

const gate=document.getElementById('gate');let st=0,lastFr=-1,run=false;
function loop(now){
  if(!run)return;requestAnimationFrame(loop);const t=(now-st)/1000;
  if(t>DUR){run=false;document.getElementById('gl').textContent='[ смотреть ещё раз ]';gate.hidden=false;return}
  const fr=Math.floor(t*FPS);if(fr!==lastFr){lastFr=fr;renderFrame(fr/FPS)}
}
gate.addEventListener('click',()=>{st=performance.now();lastFr=-1;gate.hidden=true;run=true;requestAnimationFrame(loop)});
renderFrame(2);gate.focus();
})();
</script>
</body>
</html>
